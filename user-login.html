<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login User - ABK Server</title>
<style>
  :root { --bg: #0a0e1a; --card: #111827; --border: #1f2937; --text: #e2e8f0; --text-dim: #94a3b8; --accent: #f59e0b; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; text-align: center; }
  .lock { font-size: 60px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; color: var(--accent); letter-spacing: 1px; }
  p.sub { font-size: 12px; color: var(--text-dim); margin: 0 0 24px; }
  input { width: 100%; padding: 12px 14px; margin-bottom: 12px; background: #0a0e1a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  #err { color: #f87171; font-size: 12px; margin-top: 12px; min-height: 18px; }
  .info { font-size: 11px; color: var(--text-dim); margin-top: 16px; word-break: break-all; }
  #hwid { color: var(--accent); font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="lock">🔒</div>
    <h1>SYSTEM ACCESS</h1>
    <p class="sub">Authorized Personnel Only — ABK Server</p>

    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">LOGIN</button>
    <div id="err"></div>

    <div class="info">
      HWID: <span id="hwid" onclick="copyHwid()">-</span>
    </div>
  </div>

<script>
const API_URL = "https://abkpaneltokenserver.netlify.app/api/validate";
let tokenData = null;

// Generate HWID unik untuk device ini
function getHwid() {
  let hwid = localStorage.getItem("user_hwid");
  if (!hwid) {
    hwid = "DEV-" + Math.random().toString(36).slice(2, 10).toUpperCase() + "-" + Date.now().toString(36).toUpperCase();
    localStorage.setItem("user_hwid", hwid);
  }
  return hwid;
}

function copyHwid() {
  const hwid = getHwid();
  navigator.clipboard.writeText(hwid).then(() => {
    alert("HWID dicopy: " + hwid);
  });
}

async function doLogin() {
  const errEl = document.getElementById("err");
  const btn = document.getElementById("loginBtn");
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !password) {
    errEl.textContent = "Isi username & password";
    return;
  }

  btn.disabled = true;
  btn.textContent = "MEMPROSES...";
  errEl.textContent = "";

  try {
    const hwid = getHwid();
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, hwid })
    });

    const data = await res.json();

    if (data.maintenance) {
      errEl.textContent = "🔧 " + (data.message || "Server maintenance");
      btn.disabled = false;
      btn.textContent = "LOGIN";
      return;
    }

    if (!data.valid) {
      errEl.textContent = "❌ " + (data.message || "Login gagal");
      btn.disabled = false;
      btn.textContent = "LOGIN";
      return;
    }

    // Login berhasil — simpan token
    localStorage.setItem("user_token", JSON.stringify({
      username,
      password,
      expiry: data.user.expiry,
      sisa_hari: data.user.sisa_hari,
      login_time: Date.now()
    }));

    // Tampilkan notifikasi
    alert("✅ Login berhasil!\nUser: " + data.user.username + "\nExpiry: " + data.user.expiry + "\nSisa: " + data.user.sisa_hari + " hari");

    // Tampilkan pesan dari admin (kalau ada)
    if (data.messages && data.messages.length > 0) {
      const msg = data.messages[data.messages.length - 1];
      setTimeout(() => alert("📢 " + msg.content), 500);
    }

  } catch (e) {
    errEl.textContent = "❌ Gagal koneksi ke server";
    btn.disabled = false;
    btn.textContent = "LOGIN";
  }
}

// Auto-fill kalau sudah pernah login
window.addEventListener("load", () => {
  document.getElementById("hwid").textContent = getHwid();
  const saved = localStorage.getItem("user_token");
  if (saved) {
    try {
      const t = JSON.parse(saved);
      document.getElementById("username").value = t.username || "";
      document.getElementById("password").value = t.password || "";
    } catch {}
  }
});
</script>
</body>
</html>
